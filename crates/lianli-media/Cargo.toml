[package]
name = "lianli-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
lianli-shared = { path = "../lianli-shared" }
image = { workspace = true, optional = true }
turbojpeg = { workspace = true, optional = true }
ab_glyph = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
imageproc = { workspace = true, optional = true }
fast_image_resize = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }

[features]
default = ["media"]
# Image, video, text and sensor rendering for LCDs. Without it only the RGB renderers build.
media = [
    "dep:image",
    "dep:turbojpeg",
    "dep:ab_glyph",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tracing",
    "dep:parking_lot",
    "dep:imageproc",
    "dep:fast_image_resize",
    "dep:libc",
    "dep:serde_json",
    "dep:chrono",
    "dep:ffmpeg-next",
]

[dev-dependencies]
gif = "0.14"
png = "0.18"

[[bin]]
name = "render-preview"
path = "src/bin/render_preview.rs"
required-features = ["media"]
