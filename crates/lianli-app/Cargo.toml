[package]
name = "rgbable"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "RGBable: Windows desktop app for Lian Li hardware (unofficial), built on lian-li-linux"

[[bin]]
name = "rgbable"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
lianli-devices = { path = "../lianli-devices" }
lianli-media = { path = "../lianli-media", default-features = false }
lianli-shared = { path = "../lianli-shared" }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "2", features = ["json"] }
rhai = { version = "1", features = ["sync", "f32_float", "no_custom_syntax"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
