[package]
name = "rgbable"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "RGBable: Windows desktop app for Lian Li hardware (unofficial), built on lian-li-linux"

[[bin]]
name = "rgbable"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
lianli-devices = { path = "../lianli-devices" }
lianli-media = { path = "../lianli-media", default-features = false }
lianli-shared = { path = "../lianli-shared" }
lianli-transport = { path = "../lianli-transport" }
hidapi = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "2", features = ["json"] }
ab_glyph = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ttf-parser = "0.25"
chrono = { workspace = true }
nvml-wrapper = "0.11"
rhai = { version = "1", features = ["sync", "f32_float", "no_custom_syntax"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
